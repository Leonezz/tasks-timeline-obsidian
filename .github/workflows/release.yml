name: Release Obsidian Plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify release tag
              run: node -e 'const fs=require("fs"); const manifest=JSON.parse(fs.readFileSync("manifest.json","utf8")); const tag=process.env.GITHUB_REF_NAME; if (tag !== manifest.version) { throw new Error("Release tag " + tag + " does not match manifest version " + manifest.version); }'

            - name: Build
              run: pnpm build

            - name: Attest release assets
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      dist/main.js
                      dist/styles.css
                      dist/manifest.json

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/main.js
                      dist/styles.css
                      dist/manifest.json
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
